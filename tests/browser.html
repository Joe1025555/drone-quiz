<!doctype html>
<html lang="zh-Hant"><meta charset="UTF-8"><title>Browser checks</title>
<pre id="output">RUNNING</pre><iframe id="app" src="../site/index.html" width="1100" height="900"></iframe>
<script>
const frame = document.getElementById('app');
const output = document.getElementById('output');
const passed = [];
let phase = 0;
let homeSnapshot;
function check(condition, message) {
  if (!condition) throw new Error(message);
  passed.push(message);
}
function activeSnapshot(state) {
  const { ids, answers, flags, current, mode, chapterScope, startedAt, deadline, finishedAt } = state;
  return JSON.stringify({ ids, answers, flags, current, mode, chapterScope, startedAt, deadline, finishedAt });
}
frame.addEventListener('load', () => {
  try {
    const w = frame.contentWindow;
    const d = w.document;
    const get = id => d.getElementById(id);
    const key = 'drone-quiz-1150202-v1';
    if (phase === 0) {
      frame.style.width = '320px';
      check(d.documentElement.scrollWidth <= 320, 'Welcome layout fits 320px viewport');
      for (let attempt = 0; attempt < 100; attempt++) {
        const selected = w.Quiz.sample(w.QUESTION_BANK);
        const chapters = Array.from(new Set(w.QUESTION_BANK.map(q => q.chapter)));
        const counts = chapters.map(chapter => selected.filter(q => q.chapter === chapter).length);
        if (counts.join(',') !== '5,9,4,2' || new Set(selected.map(q => q.id)).size !== 20) throw new Error('Chapter proportions or uniqueness failed');
      }
      check(true, '100 draws keep chapter proportions 5/9/4/2 with no duplicates');
      for (const chapter of new Set(w.QUESTION_BANK.map(q => q.chapter))) {
        const pool = w.QUESTION_BANK.filter(q => q.chapter === chapter);
        const full = w.Quiz.practice(pool, pool.length);
        if (full.length !== pool.length || new Set(full.map(q => q.id)).size !== pool.length || full.some(q => q.chapter !== chapter)) throw new Error('Full chapter coverage failed');
      }
      check(true, 'Each of four chapters can include every question without duplicates');
      get('start').click();
      check(!get('exam').hidden && get('question-nav').children.length === 20, 'Start: 20 navigation buttons');
      check(get('timer').textContent === '30:00', 'Timer starts at 30:00');
      check(get('exam').querySelectorAll('.explanation').length === 0, 'No explanations are shown during active exam');
      check(d.documentElement.scrollWidth <= 320, 'Exam layout fits 320px viewport');
      const state = JSON.parse(w.localStorage.getItem(key));
      check(new Set(state.ids).size === 20, '20 unique questions');
      get('options').querySelector('input[value="A"]').click();
      get('next').click();
      get('question-nav').children[0].click();
      check(get('options').querySelector('input[value="A"]').checked, 'Return to question preserves selection');
      get('options').querySelector('input[value="B"]').click();
      check(JSON.parse(w.localStorage.getItem(key)).answers[0] === 'B', 'Answer can be changed');
      check(!get('options').textContent.includes('正確') && !get('options').textContent.includes('✅'), 'No answers revealed during exam');
      get('flag-question').click();
      check(get('flag-question').getAttribute('aria-pressed') === 'true' && get('question-nav').children[0].textContent.includes('☆'), 'Flag is visible in question navigation');
      homeSnapshot = activeSnapshot(JSON.parse(w.localStorage.getItem(key)));
      get('home-button').click();
      check(!get('welcome').hidden && get('exam').hidden && get('results').hidden, 'Header returns active exam to home');
      check(!get('resume-panel').hidden && get('resume-message').textContent.length > 0, 'Home offers saved exam continuation');
      check(activeSnapshot(JSON.parse(w.localStorage.getItem(key))) === homeSnapshot, 'Returning home preserves questions, answers, flags, position and deadline');
      check(JSON.parse(w.localStorage.getItem(key)).screen === 'welcome', 'Home choice persists for reload');
      check(d.documentElement.scrollWidth <= 320, 'Home resume panel fits 320px viewport');
      get('start').click();
      check(get('new-exam-dialog').open && activeSnapshot(JSON.parse(w.localStorage.getItem(key))) === homeSnapshot, 'Starting another exam asks before replacing active progress');
      get('cancel-new-exam').click();
      check(!get('new-exam-dialog').open && !get('welcome').hidden && activeSnapshot(JSON.parse(w.localStorage.getItem(key))) === homeSnapshot, 'Cancel replacement keeps home and saved progress');
      const realNow = w.Date.now;
      const saved = JSON.parse(w.localStorage.getItem(key));
      w.Date.now = () => saved.startedAt + 61000;
      w.dispatchEvent(new w.Event('pageshow'));
      check(activeSnapshot(JSON.parse(w.localStorage.getItem(key))) === homeSnapshot && get('timer').textContent === '28:59', 'Countdown continues on home without extending deadline');
      w.Date.now = realNow;
      phase = 5;
      w.location.reload();
    } else if (phase === 5) {
      check(!get('welcome').hidden && get('exam').hidden && !get('resume-panel').hidden, 'Reload of home restores home and resume panel');
      check(activeSnapshot(JSON.parse(w.localStorage.getItem(key))) === homeSnapshot, 'Home reload retains all active progress and original deadline');
      get('resume-exam').click();
      check(!get('exam').hidden && get('welcome').hidden && get('options').querySelector('input[value="B"]').checked && get('flag-question').getAttribute('aria-pressed') === 'true', 'Continue exam restores selection and pending flag');
      check(activeSnapshot(JSON.parse(w.localStorage.getItem(key))) === homeSnapshot && JSON.parse(w.localStorage.getItem(key)).screen === 'exam', 'Continue resumes original question set and deadline');
      w.history.replaceState(null, '', '#home');
      phase = 6;
      w.location.reload();
    } else if (phase === 6) {
      check(!get('welcome').hidden && get('exam').hidden && activeSnapshot(JSON.parse(w.localStorage.getItem(key))) === homeSnapshot, 'Home link opens selector while preserving active exam');
      get('resume-exam').click();
      check(!get('exam').hidden && w.location.hash === '', 'Continue clears home link so exam reload restores exam');
      phase = 1;
      w.location.reload();
    } else if (phase === 1) {
      check(!get('exam').hidden && get('welcome').hidden, 'Reload from active exam restores exam screen');
      check(get('options').querySelector('input[value="B"]').checked, 'Reload restores answer');
      check(get('flag-question').getAttribute('aria-pressed') === 'true', 'Reload restores pending flag');
      get('next').click(); get('next-flagged').click();
      check(JSON.parse(w.localStorage.getItem(key)).current === 0, 'Jump returns to flagged question');
      get('submit').click();
      check(get('submit-dialog').open && get('submit-message').textContent.includes('19'), 'Submission warns about 19 unanswered questions');
      get('cancel-submit').click();
      check(!get('submit-dialog').open && !get('exam').hidden, 'Cancel returns to active exam');
      const state = JSON.parse(w.localStorage.getItem(key));
      for (let i = 0; i < 20; i++) {
        get('question-nav').children[i].click();
        const question = w.QUESTION_BANK.find(q => q.id === state.ids[i]);
        const answer = i < 10 ? question.answer : i < 15 ? question.options.find(o => o.label !== question.answer).label : null;
        // The first question's earlier answer is replaced above; last 5 stay unanswered.
        if (answer) get('options').querySelector(`input[value="${answer}"]`).click();
      }
      get('submit').click(); get('confirm-submit').click();
      check(!get('results').hidden && get('exam').hidden, 'Submission switches to one-page results');
      check(get('score').textContent === '50', '10 correct answers score 50');
      check(d.documentElement.scrollWidth <= 320, 'Result layout fits 320px viewport');
      check(get('result-stats').textContent.includes('答錯 5 題') && get('result-stats').textContent.includes('未作答 5 題'), 'Mixed incorrect and unanswered totals');
      check(get('review-list').children.length === 20 && d.querySelectorAll('.right-answer').length === 20, 'All 20 questions show correct answers');
      check(d.querySelectorAll('#review-list .explanation').length === 20 && !d.querySelector('.explanation').open, 'Result explanations available but collapsed');
      const explanation = d.querySelector('.explanation');
      explanation.querySelector('summary').click();
      check(explanation.open && explanation.querySelector('.explanation-body p').textContent.length > 10 && explanation.querySelector('a').href.startsWith('https://'), 'Result expands explanation and official reference link');
      check(get('chapter-stats').children.length === 4, 'Result lists four chapter accuracy bars');
      get('review-wrong').click();
      check([...get('review-list').children].filter(card => !card.hidden).length === 10, 'Wrong-only filter includes unanswered questions');
      get('review-all').click();
      check([...get('review-list').children].every(card => !card.hidden), 'All filter restores 20 reviews');
      check(JSON.parse(w.localStorage.getItem('drone-quiz-mistakes-1150202')).length >= 10, 'Wrong questions persist in mistake bank');
      get('restart').click();
      check(!get('exam').hidden && get('progress').textContent.includes('0 / 20'), 'Restart clears answers');
      const started = JSON.parse(w.localStorage.getItem(key));
      const realNow = w.Date.now;
      get('home-button').click(); get('start').click();
      w.Date.now = () => started.deadline + 1000;
      w.dispatchEvent(new w.Event('pageshow'));
      check(!get('results').hidden && get('finish-reason').textContent.includes('自動交卷') && !get('new-exam-dialog').open, 'Deadline submits from home and closes replacement prompt');
      check(get('score').textContent === '0' && get('result-stats').textContent.includes('未作答 20 題'), 'Unanswered timeout scores 0');
      w.Date.now = realNow;
      get('restart').click();
      const expired = JSON.parse(w.localStorage.getItem(key));
      expired.startedAt = realNow() - w.Quiz.DURATION - 1000;
      expired.deadline = expired.startedAt + w.Quiz.DURATION;
      w.localStorage.setItem(key, JSON.stringify(expired));
      phase = 2;
      w.location.reload();
    } else if (phase === 2) {
      check(!get('results').hidden && get('finish-reason').textContent.includes('自動交卷'), 'Expired persisted exam submits on reopening');
      get('practice-home').click();
      check(!get('welcome').hidden && get('results').hidden && !get('resume-panel').hidden && get('resume-title').textContent.includes('已完成'), 'Results return to home with completed result summary');
      phase = 7;
      w.location.reload();
    } else if (phase === 7) {
      check(!get('welcome').hidden && !get('resume-panel').hidden && get('resume-title').textContent.includes('已完成'), 'Completed home reload retains last result summary');
      get('resume-exam').click();
      check(!get('results').hidden && get('welcome').hidden && get('finish-reason').textContent.includes('自動交卷'), 'Home reopens last completed result');
      check(d.activeElement === get('result-heading'), 'Reopened result focuses result heading');
      get('home-button').click();
      get('practice-chapter').selectedIndex = 2;
      get('start-chapter').click();
      const chapterState = JSON.parse(w.localStorage.getItem(key));
      check(chapterState.ids.length === 20 && chapterState.ids.every(id => w.QUESTION_BANK.find(q => q.id === id).chapter === get('practice-chapter').value), 'Chapter practice draws 20 questions only from chosen chapter');
      check(get('exam-mode').textContent === '章節練習', 'Mode label distinguishes chapter practice');
      get('options').querySelector('input[value="A"]').click();
      get('home-button').click();
      const chapterSnapshot = activeSnapshot(JSON.parse(w.localStorage.getItem(key)));
      get('practice-chapter').selectedIndex = 1;
      get('practice-chapter').dispatchEvent(new w.Event('change'));
      get('practice-size').value = 'all'; get('practice-size').dispatchEvent(new w.Event('change'));
      check(get('chapter-practice-info').textContent.includes('172 題') && get('chapter-practice-info').textContent.includes('860 分'), 'Whole chapter selection previews count and maximum score');
      get('start-chapter').click();
      check(get('new-exam-dialog').open && activeSnapshot(JSON.parse(w.localStorage.getItem(key))) === chapterSnapshot, 'Full chapter replacement preserves previous chapter practice until confirmation');
      get('confirm-new-exam').click();
      const full = JSON.parse(w.localStorage.getItem(key));
      check(!get('new-exam-dialog').open && !get('exam').hidden && full.answers.every(answer => answer === null) && full.flags.every(flag => !flag), 'Confirm replacement starts fresh chapter answers and flags');
      check(full.ids.length === 172 && new Set(full.ids).size === 172 && full.ids.every(id => w.QUESTION_BANK.find(q => q.id === id).chapter === get('practice-chapter').value), 'Whole chapter has all 172 unique questions in one chapter');
      check(get('question-nav').children.length === 172 && d.documentElement.scrollWidth <= 320, 'Full chapter navigation fits narrow viewport');
      get('question-nav').children[171].click();
      get('options').querySelector('input[value="A"]').click(); get('flag-question').click();
      phase = 25; w.location.reload();
    } else if (phase === 25) {
      const full = JSON.parse(w.localStorage.getItem(key));
      check(full.ids.length === 172 && full.current === 171 && full.answers[171] === 'A' && full.flags[171], 'Full chapter reload restores last question answer and flag');
      for (let i = 0; i < 172; i++) {
        get('question-nav').children[i].click();
        const answer = w.QUESTION_BANK.find(q => q.id === full.ids[i]).answer;
        get('options').querySelector(`input[value="${answer}"]`).click();
      }
      get('next').click(); get('confirm-submit').click();
      check(get('score').textContent === '860' && get('review-list').children.length === 172, 'Whole chapter scores all 172 answers and reviews every question');
      const ids = w.QUESTION_BANK.slice(0, 3).map(q => q.id);
      w.localStorage.setItem('drone-quiz-mistakes-1150202', JSON.stringify(ids));
      w.localStorage.removeItem(key);
      phase = 3; w.location.reload();
    } else if (phase === 3) {
      check(get('start-mistakes').textContent.includes('3 題'), 'Mistake count restored from storage');
      get('start-mistakes').click();
      const short = JSON.parse(w.localStorage.getItem(key));
      check(short.ids.length === 3 && get('question-nav').children.length === 3, 'Small mistake bank produces three-question practice');
      for (let i = 0; i < 3; i++) {
        get('question-nav').children[i].click();
        const answer = w.QUESTION_BANK.find(q => q.id === short.ids[i]).answer;
        get('options').querySelector(`input[value="${answer}"]`).click();
      }
      check(get('next').textContent.includes('交卷'), 'Short practice final question offers submission');
      get('next').click(); get('confirm-submit').click();
      check(get('score').textContent === '15' && get('score').nextElementSibling.textContent.includes('15'), 'Short practice maximum is 15 points');
      check(JSON.parse(w.localStorage.getItem('drone-quiz-mistakes-1150202')).length === 0 && get('result-mistakes').disabled, 'Correct retry removes mistakes and disables empty practice');
      get('review-wrong').click(); check(!get('review-empty').hidden, 'All-correct result has clear empty state');
      w.localStorage.removeItem(key); w.localStorage.removeItem('drone-quiz-mistakes-1150202');
      phase = 4; frame.src = '../site/question-bank.html';
    } else {
      check(d.querySelectorAll('.bank-question').length === 388, 'Search page retains all 388 Markdown questions');
      check(Object.keys(w.QUESTION_EXPLANATIONS).length === 388 && [...d.querySelectorAll('.bank-question')].every(q => q.querySelector('.explanation-body p')?.textContent.length > 10 && q.querySelector('.explanation-sources a')), 'All 388 questions have explanation text and reference links');
      get('bank-query').value = '電池'; get('bank-query').dispatchEvent(new w.Event('input'));
      const matches = [...d.querySelectorAll('.bank-question')].filter(q => !q.hidden);
      check(matches.length > 0 && matches.length < 388 && matches.every(q => q.textContent.includes('電池')), 'Keyword search filters question content');
      get('bank-query').value = '不會出現的搜尋字串123'; get('bank-query').dispatchEvent(new w.Event('input'));
      check(!get('search-empty').hidden, 'Search provides no-match feedback');
      get('clear-search').click();
      get('bank-chapter').selectedIndex = 3; get('bank-chapter').dispatchEvent(new w.Event('change'));
      check([...d.querySelectorAll('.bank-question')].filter(q => !q.hidden).length === 82, 'Chapter search filter selects 82 meteorology questions');
      get('clear-search').click();
      check([...d.querySelectorAll('.bank-question')].every(q => !q.hidden), 'Clear filter restores all questions');
      frame.style.width = '320px';
      check(d.documentElement.scrollWidth <= 320, 'Question bank layout fits 320px viewport');
      output.textContent = 'PASS ' + passed.length + ' checks\n' + passed.join('\n');
    }
  } catch (error) { output.textContent = 'FAIL: ' + error.stack + '\n' + passed.join('\n'); }
});
</script></html>
